<style>
.flow{stroke-dasharray:2 14;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.85;transform:scale(.7)}100%{opacity:0;transform:scale(1.7)}}
.plan{animation:plan 2.8s ease-in-out infinite alternate}
@keyframes plan{from{opacity:.35}to{opacity:.95}}
.plan.late{animation-delay:1.4s}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important}}
</style>
